<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Shooter JS</title>
    <link rel="stylesheet" href="./assets/css/game.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <div id="startScreen" class="tela-inicio">
        <button id="startButton">
            INICIAR JOGO
        </button>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <button id="upgradeButton" class="overlay-button">UPGRADE (500)</button>
        <button id="superLaserButton" class="overlay-button" onclick="trySuperLaser()">
            <span class="laser-label">BURST</span>
            <span id="laserCost" class="laser-percent">0%</span>
        </button>
        <div id="bossHealthBarContainer">
            <div id="bossHealthBar"></div>
        </div>

    </div>


    <audio id="bgMusic" src="./assets/audio/Ultra-Lag-chosic.com_.mp3" preload="auto" loop></audio>
    <!-- Som do tiro da nave -->
    <audio id="shootSound" src="./assets/audio/tiroNave.mp3" preload="auto"></audio>
    <!-- Som do super lazer da nave -->
    <audio id="superLaserSound" src="./assets/audio/laser.mp3" preload="auto"></audio>



    <script src="./script/GameObject.js"></script>
    <script src="./script/Projectile.js"></script>
    <script src="./script/Background.js"></script>
    <script src="./script/Player.js"></script>
    <script src="./script/Enemy.js"></script>
    <script src="./script/start_game.js"></script>
    <script src="./script/pickup.js"></script>
    <script src="./script/Spawn.js"></script>
    <script src="./script/btnUpdate.js"></script>
    <script src="./script/Boss.js"></script>

    <script src="./script/controle.js"></script>
    <script src="./script/game.js"></script>

</body>

</html>
