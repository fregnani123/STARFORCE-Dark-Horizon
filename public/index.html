<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Super Shooter JS</title>
  <link rel="stylesheet" href="../assets/css/overlay.css">
  <link rel="stylesheet" href="../assets/css/tela_inicio.css">    
  <link rel="stylesheet" href="../assets/css/btn-HUD.css">    
  <link rel="icon" type="image/x-icon" href="/favicon.ico">   
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/levelGame.css">
</head>

<body>
      <div class="video-dark-overlay "></div>
  <video muted="" id="logoVideo" class="full-screen-video">
    <source src="../assets/video/aberturaLogo.mp4" type="video/mp4">
    Seu navegador não suporta a tag de vídeo.
  </video>

      <div id="loadingOverlay">
            <div class="spinner"></div>
            <p>Loading Game...</p>
        </div>

      <div class="tela-inicio">
            <div class="menu-posicionamento">
                  <img src="../assets/img/cenario-start/ring-12779.gif" alt="" class="gif-centralizado">
                  <button id="startButton" class="botao-menu">CONTINUAR</button>
                  <button id="continuar" class="botao-menu">NOVO JOGO</button>
                  <button id="configButton" class="botao-menu">CONFIGURAÇÕES</button>
                  <button id="exit" class="botao-menu">SAIR</button>
              </div>
            <video autoplay muted id="video-fundo">
      <source src="../assets/video/videoStart.mp4" type="video/mp4">
                  Seu navegador não suporta a tag de vídeo.
    </video>
        </div>
</body>
<script>
  const continuarGame = document.getElementById("continuar");
  continuarGame.addEventListener('click', () => {
    // Substitua 'mapaFases.html' pelo nome exato do arquivo HTML de destino.
    window.location.href = '../public/game_level.html';
  });
  // SAIR DO JOGO (Desktop)
  window.addEventListener('DOMContentLoaded', () => {
    const exitButton = document.getElementById('exit');

    exitButton.addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.closeApp) {
        window.electronAPI.closeApp();
      } else {
        alert("Funcionalidade disponível apenas no desktop.");
      }
    });
  });
</script>
<script src="../script/start_game/start_game.js"></script>
<script src="../script/tela_inicial.js"></script>

</html>
