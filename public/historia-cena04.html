<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarForce Dark Horizon - Cena 04</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/historiaCena04.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <div id="scene-wrap">
        <img id="scene-img-a" src="" alt="">
        <img id="scene-img-b" src="" alt="">
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>
    <div id="letterbox-top"></div>
    <div id="letterbox-bot"></div>
    <div id="glitch-flash"></div>

    <div id="hud-top">
        <div class="hud-label"><span class="rec-dot"></span>REC CLASSIFIED</div>
        <div class="hud-label" id="year-label">YEAR - 2201 A.D.</div>
        <div class="hud-coord" id="coord-label">00N - 00E - BASE LUNAR</div>
    </div>

    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

    <div id="text-block">
        <div id="chapter-label"></div>
        <div class="dialogue-wrapper">
            <div class="portrait-container">
                <img id="speaker-img" src="" alt="Retrato">
            </div>
            <div class="text-wrap">
                <div id="speaker-name"></div>
                <p id="dialogue"></p>
            </div>
        </div>
        <div id="continue-hint">ESC para pular - Clique para avançar</div>
    </div>

    <div id="fade-out"></div>

  <script src="../script/gameLevel/historiaCena04.js"></script>
</body>
</html>
